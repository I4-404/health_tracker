name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.6'
          channel: stable
          cache: true

      - name: Check Flutter
        run: |
          flutter --version
          dart --version

      - name: Get dependencies
        run: flutter pub get

      - name: Fix old fab_circular_menu package
        run: |
          FILE="$HOME/.pub-cache/hosted/pub.dev/fab_circular_menu-1.0.2/lib/fab_circular_menu.dart"
          sed -i 's/Theme\.of(context)\.accentColor/Theme.of(context).colorScheme.secondary/g' "$FILE"

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: health-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk